name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Go のバージョンの正本は go.mod。ここに数字を書かない。
          go-version-file: go.mod

      - run: go build ./...
      - run: go test ./...
      - run: go tool golangci-lint run
